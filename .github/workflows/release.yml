name: Build and publish release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Version matching Smooth-Coder.App.csproj (for example 0.6.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          $requested = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          $project = [xml](Get-Content 'src/Smooth-Coder.App/Smooth-Coder.App.csproj')
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($requested -ne $projectVersion) {
            throw "Release version $requested does not match project version $projectVersion."
          }
          "value=$requested" >> $env:GITHUB_OUTPUT

      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore Smooth-Coder.slnx
          dotnet test Smooth-Coder.slnx -c Release --no-restore

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Pack and publish GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release.ps1 -Version '${{ steps.version.outputs.value }}' -Upload
